{% extends "base.html" %}
{% block content %}
<section class="state">
  <div class="state-icon bad"><i data-lucide="file-warning">!</i></div>
  <h1>导出范围过大</h1>
  <p>{{ message }}</p>
  <ol>
    <li>用筛选栏的「本月」「本周」按钮，或手工填开始和结束日期。</li>
    <li>按负责人或客户/供应商筛选后再导出。</li>
    <li>确实要全量数据时，请按月份分几次导出。</li>
  </ol>
  <div class="page-actions">
    {% if back_url %}<a class="button" href="{{ back_url }}"><i data-lucide="corner-up-left"></i>返回重新筛选</a>{% else %}<a class="button" href="{% url 'sales:shipment_list' %}"><i data-lucide="corner-up-left"></i>返回</a>{% endif %}
  </div>
</section>
{% endblock %}
