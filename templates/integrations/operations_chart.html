{% load l10n %}
<div class="legend">{% for series in chart.series %}<span><i style="background:{{ series.color }}"></i>{{ series.label }}</span>{% endfor %}</div>
{% if chart.has_data %}<svg viewBox="0 0 700 220" role="img" aria-label="{{ chart_label }}，单位万元">
{% for tick in chart.y_ticks %}<line x1="52" x2="676" y1="{{ tick.y }}" y2="{{ tick.y }}" stroke="#edf1f7"/><text x="46" y="{{ tick.y }}" text-anchor="end" dominant-baseline="middle">{{ tick.label }}</text>{% endfor %}
{% if chart.has_negative %}<line x1="52" x2="676" y1="{{ chart.zero_y|unlocalize }}" y2="{{ chart.zero_y|unlocalize }}" stroke="#bdc9d8"/>{% endif %}
<line x1="52" x2="52" y1="28" y2="168" stroke="#cbd5e1"/><line x1="52" x2="676" y1="168" y2="168" stroke="#cbd5e1"/>
{% for series in chart.series %}<polyline points="{{ series.points }}" stroke="{{ series.color }}" fill="none" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>{% for point in series.points_list %}<circle cx="{{ point.x }}" cy="{{ point.y }}" r="3" fill="{{ series.color }}" class="chart-point" data-series="{{ series.label }}" data-date="{{ point.date }}" data-value="{{ point.value }}"/>{% endfor %}{% endfor %}
{% for label in chart.x_labels %}<text x="{{ label.x }}" y="186" text-anchor="middle">{{ label.label }}</text>{% endfor %}
</svg>{% else %}<p class="empty">暂无金蝶逐日数据；请确认同步窗口并重新生成快照。</p>{% endif %}
