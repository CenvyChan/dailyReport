{% extends "base.html" %}
{% block content %}
<div class="login-head">
  <h1>FINOSSReportSystem 登录</h1>
  <a class="help-link" href="{% url 'core:user_guide' %}" target="_blank" rel="noopener" title="打开用户使用指南">
    <span class="help-icon" aria-hidden="true">?</span><span>帮助信息</span>
  </a>
</div>
<p class="page-help">先选择要进入的公司，再输入账号密码；各公司的业务数据相互隔离，账号和角色在公司之间共用。</p>
<form method="post">{% csrf_token %}{{ form.as_p }}<button type="submit">登录</button></form>
<p class="page-help">没有可选的公司，或提示无该公司权限？说明管理员还没给你的账号授权这家公司，请联系管理员在「用户公司授权」中添加。</p>
{% endblock %}
